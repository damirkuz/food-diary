# Helm-чарт: open-telemetry/opentelemetry-collector, версия 0.176.0.
# Релиз: otel-logs, пространство имён: logging. Версия образа закреплена ниже.
# Перед включением сбора приложение должно писать JSON в stdout.
mode: daemonset

image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.162.0"

command:
  name: otelcol-contrib

presets:
  logsCollection:
    enabled: true
    includeCollectorLogs: false
    # Сохраняет позиции чтения файлов в /var/lib/otelcol на ноде.
    # Этот пресет запускает сборщик от root для записи в каталог ноды.
    storeCheckpoints: true
  kubernetesAttributes:
    enabled: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

securityContext:
  runAsUser: 0
  runAsNonRoot: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# Сборщик читает файлы; приложения не отправляют телеметрию на его порты.
ports:
  otlp:
    enabled: false
  otlp-http:
    enabled: false
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  metrics:
    enabled: false

config:
  receivers:
    otlp: null
    jaeger: null
    zipkin: null
    prometheus: null
    file_log:
      include:
        - /var/log/pods/food-diary-test_*_*/food-diary/*.log
        - /var/log/pods/food-diary-prod_*_*/food-diary/*.log
      # При первом обнаружении читает новые строки; далее продолжает с сохранённой позиции.
      start_at: end
      include_file_path: true
      retry_on_failure:
        enabled: true
      operators:
        # Разбирает обёртку CRI/Docker и извлекает сведения о pod из пути файла.
        - type: container
          id: container-parser
          max_log_size: 1048576
        # Сохраняет строки без JSON как обычный текст, например диагностику JVM.
        - type: json_parser
          id: application-json
          if: 'body matches "^\\s*\\{"'
          parse_from: body
          parse_to: attributes
          parse_ints: true
          on_error: send
          timestamp:
            parse_from: attributes.timestamp
            layout_type: gotime
            layout: "2006-01-02T15:04:05.999999999Z07:00"
          severity:
            parse_from: attributes.level
        - type: move
          from: attributes["service.name"]
          to: resource["service.name"]
          if: 'attributes["service.name"] != nil'
        - type: copy
          from: attributes.message
          to: body
          if: 'attributes.message != nil'

  processors:
    memory_limiter:
      check_interval: 1s
      limit_percentage: 75
      spike_limit_percentage: 20
    k8s_attributes:
      extract:
        metadata:
          - k8s.namespace.name
          - k8s.pod.name
          - k8s.node.name
          - k8s.container.name
    batch:
      timeout: 1s
      send_batch_size: 128
      send_batch_max_size: 256

  exporters:
    debug: null
    otlp_http/victorialogs:
      logs_endpoint: http://vls-victoria-logs-single-server.logging.svc.cluster.local:9428/insert/opentelemetry/v1/logs
      compression: gzip
      headers:
        # Не включает request_id, URL и другие поля отдельных событий в ключ потока.
        VL-Stream-Fields: service.name,k8s.namespace.name,k8s.pod.name,k8s.container.name
      sending_queue:
        enabled: true
        queue_size: 128
        # Использует расширение и каталог ноды, созданные пресетом storeCheckpoints.
        storage: file_storage
      retry_on_failure:
        enabled: true
        initial_interval: 1s
        max_interval: 30s
        max_elapsed_time: 0s

  service:
    telemetry:
      metrics:
        level: none
        readers: []
    pipelines:
      metrics: null
      traces: null
      logs:
        receivers: [file_log]
        processors: [memory_limiter, k8s_attributes, batch]
        exporters: [otlp_http/victorialogs]
