---
apiVersion: v1
kind: Service
metadata:
  name: food-diary-service
spec:
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: food-diary
  type: ClusterIP
...

---
apiVersion: v1
kind: Service
metadata:
  name: food-diary-db
spec:
  ports:
