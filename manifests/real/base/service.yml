---
apiVersion: v1
kind: Service
metadata:
  name: food-diary-service
spec:
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: food-diary
  type: ClusterIP
...

---
apiVersion: v1
kind: Service
metadata:
  name: food-diary-db
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
    - name: metrics
      port: 9187
      targetPort: pg-metrics
  selector:
    app: food-diary-db
  type: ClusterIP
...

---
apiVersion: v1
kind: Service
metadata:
  name: food-diary-redis
spec:
  ports:
    - port: 6379
  selector:
    app: food-diary-redis
  type: ClusterIP
...