---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-diary
spec:
  replicas: 3
  selector:
    matchLabels:
      app: food-diary
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: food-diary
    spec:
      containers:
      - image: food-diary:1.0.2
        name: food-diary
        envFrom:
          - configMapRef:
              name: food-diary-configmap
          - secretRef:
              name: food-diary-secret
        ports:
        - containerPort: 8080
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
          initialDelaySeconds: 10
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 1
            memory: 768Mi

...

