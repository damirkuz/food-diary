---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-diary
spec:
  replicas: 3
  selector:
    matchLabels:
      app: food-diary
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: food-diary
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
      - image: food-diary:1.0.5
        name: food-diary
        envFrom:
          - configMapRef:
              name: food-diary-configmap
          - secretRef:
              name: food-diary-secret
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8081
          name: management
        # До успешного запуска остальные пробы не выполняются.
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: management
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 36
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /actuator/health/readiness
            port: management
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /actuator/health/liveness
            port: management
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
          initialDelaySeconds: 10
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 1
            memory: 768Mi

...

