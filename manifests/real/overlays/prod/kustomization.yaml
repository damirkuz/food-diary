apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: food-diary-prod

resources:
  - namespace.yaml
  - ../../base

patches:
  - path: configmap-patch.yaml
  - path: httproute-patch.yaml

# ПОСЛЕ apply — вручную (единственный шаг вне git): закрепить nodePort Envoy-сервиса
# за предпубликованным minikube-портом 32443 (хост-порт 80), иначе порт случайный
# и с хоста недостижим:
#   kubectl -n envoy-gateway-system patch svc $(kubectl -n envoy-gateway-system get svc -o name | grep food-diary-prod) \
#     -p '{"spec":{"ports":[{"name":"http-80","nodePort":32443,"port":80,"protocol":"TCP","targetPort":10080}]}}'
# Прод за стандартным 80 — RequestHeaderModifier в httproute-patch не нужен.
