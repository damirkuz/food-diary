services:
    db:
      image: postgres:17-alpine
      container_name: food-diary-db
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: food-diary-db
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
    redis:
      image: redis:7
      container_name: food-diary-redis
      ports:
        - "6379:6379"