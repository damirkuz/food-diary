services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: food-diary-app
    restart: unless-stopped
    networks:
      - web_network
      - default
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SERVER_SERVLET_CONTEXT_PATH: /${CONTEXT_NAME}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      FOOD_DATA_SERVICE_API_KEY: ${FOOD_DATA_SERVICE_API_KEY:-}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      USDA_ENABLED: ${USDA_ENABLED:-false}
      OPEN_FOOD_FACTS_ENABLED: ${OPEN_FOOD_FACTS_ENABLED:-true}
    labels:
      - traefik.enable=true
      - traefik.docker.network=web_network
      - traefik.http.routers.fooddiary.rule=(Host(`${DOMAIN}`) || Host(`${IP_HOST}`)) && PathPrefix(`/${CONTEXT_NAME}`)
      - traefik.http.routers.fooddiary.entrypoints=web,websecure
      - traefik.http.routers.fooddiary.tls.certresolver=myresolver
      - traefik.http.routers.fooddiary.service=fooddiary
      - traefik.http.services.fooddiary.loadbalancer.server.port=8080
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:17-alpine
    container_name: food-diary-db
    restart: unless-stopped
    networks:
      - default
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: food-diary-redis
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  web_network:
    external: true

volumes:
  postgres_data:
