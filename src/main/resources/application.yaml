server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  main:
    banner-mode: "off"
  application:
    name: food-diary
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  freemarker:
    template-loader-path: classpath:/templates/
    suffix: .ftlh
    charset: UTF-8
    content-type: text/html
    cache: ${FREEMARKER_CACHE:false}
    expose-request-attributes: true
    expose-session-attributes: true
    expose-spring-macro-helpers: true
    settings:
      localized_lookup: false
      number_format: computer
      datetime_format: iso
      date_format: iso
      time_format: iso

provider:
  open-food-facts:
    base-url: https://world.openfoodfacts.org
    enabled: ${OPEN_FOOD_FACTS_ENABLED:true}

app:
  observability:
    synthetic-users: ${SYNTHETIC_USERS:}
  nutrition-lookup-cache-duration-days: 7
  admin:
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}

logging:
  structured:
    format:
      console: logstash
    json:
      rename:
        "[@timestamp]": timestamp
      add:
        "[service.name]": ${spring.application.name}

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
